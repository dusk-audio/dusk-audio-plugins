name: JUCE compile check

# Nothing built the JUCE plugins on a pull request (GH #173).
#
# build.yml is a RELEASE pipeline: it triggers only on '<slug>-v*' tags and
# workflow_dispatch, derives its target from the tag, and runs four platform
# jobs plus a publish job. So a PR that broke a JUCE plugin stayed green until
# someone cut a tag, and the failure then landed inside a release.
#
# That gap has teeth because shared code crosses trees:
#   - plugins/shared/** reaches ELEVEN JUCE plugins. DuskLookAndFeel.h alone is
#     used by eight, and is where the #165, #167 and #168 fixes landed.
#   - plugins/shared-dpf/dsp/DuskFilters.hpp reaches the JUCE TapeMachine via
#     the cross-tree include added in #159, so that one header is compiled by
#     both frameworks and only the DPF side had a PR build.
#
# This workflow is the JUCE-side mirror of dpf-build.yml's shared-code safety
# net (its pull_request paths filter on plugins/shared-dpf/** builds every DPF
# plugin for exactly the same reason).
#
# It is a COMPILE CHECK, not a release build. Deliberately different from
# build.yml, and the differences are the point:
#   - Runs on the ubuntu-22.04 runner directly, not in an ubuntu:20.04 container.
#     The container exists to pin glibc 2.31 for binaries we SHIP; nothing here
#     is shipped, and dropping it removes the flaky toolchain PPA step.
#   - Builds VST3 only. juce_add_plugin compiles each plugin's sources once into
#     its <Plugin>_SharedCode static library, which every format wrapper then
#     links, so VST3 alone compiles 100% of the plugin and shared-header code.
#     Adding CLAP and LV2 would buy link time, not coverage.
#   - Linux for the full fleet, plus a small Windows matrix. Shared-header
#     breakage is usually a plain compile error, but CrashLog.h now carries a
#     real Windows branch and drags windows.h into every processor TU, so that
#     one platform needs covering here rather than at tag time. macOS is still
#     left to the release build.
on:
  pull_request:
    paths:
      # Shared code, the reason this workflow exists.
      - 'plugins/shared/**'
      - 'plugins/shared-dpf/dsp/DuskFilters.hpp'
      # The JUCE plugins themselves. Their own PRs were equally unbuilt, and
      # these paths are narrow enough that DPF-only work does not trigger them.
      - 'plugins/4k-eq/**'
      - 'plugins/multi-comp/**'
      - 'plugins/TapeMachine/Source/**'
      - 'plugins/TapeMachine/CMakeLists.txt'
      - 'plugins/tape-echo/Source/**'
      - 'plugins/tape-echo/CMakeLists.txt'
      - 'plugins/multi-q/**'
      - 'plugins/convolution-reverb/**'
      - 'plugins/DuskVerb/**'
      - 'plugins/DuskAmp/**'
      - 'plugins/chord-analyzer/**'
      - 'plugins/spectrum-analyzer/**'
      - 'plugins/groovemind/**'
      # A root CMake change can break every plugin at once, and so can the
      # shared modules it includes: GlobalSettings, JuceDefaults and
      # ClapDefaults set fleet-wide flags and compile definitions, and
      # PluginVersion is included by every plugin's own CMakeLists.
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/juce-compile-check.yml'
      # Subtract the DPF trees again. Several plugins above are wildcarded at
      # the plugin root, and 'plugins/4k-eq/**' matches 'plugins/4k-eq/dpf-plugin/**'
      # too, so without these a DPF-only PR would fire all twelve JUCE jobs and
      # dpf-build.yml would build it a second time. Negations must come LAST:
      # GitHub applies the patterns in order and the final match wins.
      - '!plugins/*/dpf-plugin/**'
      - '!plugins/*/core/**'
  workflow_dispatch:

# A PR that gets pushed twice should not run two fleets. Never applied to
# build.yml, where cancelling an in-flight release would be the wrong call.
concurrency:
  group: juce-compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Twelve jobs for a one-plugin change is not just wasted runner time, it is
  # wasted WALL time: the legs queue against the runner pool, so a PR touching
  # convolution-reverb waited on eleven builds that could not tell it anything.
  # This narrows the matrix to what the change can actually reach, and still
  # expands to the whole fleet the moment shared code is touched, which is the
  # case the workflow was built for.
  scope:
    name: Select plugins
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # Reads the diff and nothing else, so it needs nothing beyond contents:read.
    permissions:
      contents: read
    outputs:
      plugins: ${{ steps.pick.outputs.plugins }}
      windows: ${{ steps.pick.outputs.windows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The selector diffs against the base branch, so it needs history...
          fetch-depth: 0
          # ...but not a credential left behind in .git/config afterwards. The
          # diff is local once the fetch is done. Matches the other workflows.
          persist-credentials: false

      - name: Pick plugins
        id: pick
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/select_juce_plugins.py

  compile:
    name: ${{ matrix.plugin }}
    needs: scope
    if: needs.scope.outputs.plugins != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      # One broken plugin must not hide the others: the whole point is to learn
      # the full blast radius of a shared-header change in a single run.
      fail-fast: false
      matrix:
        # Every juce_add_plugin target in the tree, verified against
        # `ninja -t targets` on a full configure rather than read off the
        # add_subdirectory list: chord-analyzer declares TWO plugins, and
        # spectrum-analyzer and groovemind name theirs through a ${PLUGIN_NAME}
        # variable, so neither is greppable from juce_add_plugin alone.
        #
        # A plugin added to the root CMakeLists without a row here is silently
        # unbuilt, which is the class of gap this workflow exists to close. The
        # list itself now lives in .github/scripts/select_juce_plugins.py, which
        # decides which of them this particular change needs.
        plugin: ${{ fromJSON(needs.scope.outputs.plugins) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE
          ref: 8.0.4  # Must match build.yml, or this checks a different JUCE

      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        # Backstop only. Every apt attempt inside the script is individually
        # time-boxed, so this should never fire; it exists so a pathological case
        # still fails inside the job's 45-minute budget with a readable status.
        timeout-minutes: 20
        run: |
          # The retry, timeout and mirror-fallback logic that used to be spelled
          # out here now lives in the shared script, so this workflow and the two
          # release pipelines all get the same behaviour from one implementation.
          .github/scripts/apt_install.sh \
            build-essential \
            ccache \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libwebkit2gtk-4.0-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-juce-linux-${{ matrix.plugin }}-${{ github.sha }}
          restore-keys: |
            ccache-juce-linux-${{ matrix.plugin }}-

      - name: Configure CMake
        env:
          # 350M x 12 plugins keeps the whole matrix inside GitHub's 10 GB
          # per-repository cache budget with room for the DPF workflows.
          CCACHE_MAXSIZE: 350M
        run: |
          ccache --zero-stats >/dev/null 2>&1 || true
          # Ninja over the default Make generator: it parallelises the configure
          # side better and schedules a large object graph with less overhead,
          # which matters when a single plugin drags in the entire JUCE tree.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUSK_COPY_AFTER_BUILD=OFF \
            -DJUCE_PATH=$(pwd)/JUCE

      - name: Build ${{ matrix.plugin }} VST3
        # An unknown target fails here with a readable "No rule to make target"
        # rather than needing a guard step of its own.
        env:
          CCACHE_MAXSIZE: 350M
        run: cmake --build build --config Release --target ${{ matrix.plugin }}_VST3 -j$(nproc)

      - name: ccache statistics
        # Printed so a regression in hit rate is visible in the log rather than
        # only as a slower job.
        if: always()
        run: ccache --show-stats 2>/dev/null || true

      - name: Verify a binary came out
        # A target that silently produces nothing is indistinguishable from a
        # passing build in the step status, so check for the .so itself.
        run: |
          found=$(find build -path '*.vst3/Contents/x86_64-linux/*.so' -print -quit)
          if [ -z "$found" ]; then
            echo "::error::${{ matrix.plugin }}_VST3 built without producing a VST3 binary"
            exit 1
          fi
          echo "Built: $found"

  # plugins/shared/ now carries a substantial platform-specific branch:
  # CrashLog.h pulls in windows.h and compiles a whole SEH filter, CreateFileW
  # and CaptureStackBackTrace path that the Linux jobs above never see. During
  # its review a revision of that branch did not compile at all, and nothing on
  # a PR would have caught it: build.yml only builds Windows on a release tag,
  # so the first failure would have landed inside a release. That is the gap
  # this workflow exists to close, and leaving it open for exactly the code most
  # likely to break would be the wrong shape.
  #
  # A SMALL matrix, not one plugin and not all twelve.
  #
  # One is not enough: CrashLog.h does not only add its own Windows code, it
  # drags windows.h plus NOMINMAX/WIN32_LEAN_AND_MEAN into every JUCE processor
  # TU, ahead of the JUCE headers. A macro collision would therefore be a
  # per-plugin problem, not a shared-header one, and checking a single plugin
  # would not see it. Twelve Windows jobs is more than the risk justifies, so
  # this covers the distinct shapes: a plain juce_dsp user, the heaviest DSP
  # tree, an analyzer that pulls juce_dsp into the processor header, and one
  # with no juce_dsp at all.
  compile-windows:
    name: ${{ matrix.plugin }} (windows)
    needs: scope
    if: needs.scope.outputs.windows != '[]'
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The four shapes above, narrowed to the ones this change reaches.
        plugin: ${{ fromJSON(needs.scope.outputs.windows) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE
          ref: 8.0.4  # Must match build.yml and the Linux jobs above

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DDUSK_COPY_AFTER_BUILD=OFF \
            -DJUCE_PATH="$(pwd)/JUCE"

      - name: Build ${{ matrix.plugin }} VST3
        run: cmake --build build --config Release --target ${{ matrix.plugin }}_VST3

      - name: Verify a binary came out
        shell: bash
        run: |
          # Match the bundle STRUCTURE, not a path substring. The first version
          # of this looked for '*.vst3' under a '*Release*' path and failed on
          # 4K EQ and Multi-Comp, whose bundles are relocated to build/bin/VST3
          # while Chord Analyzer's and Spectrum Analyzer's stay in
          # <plugin>_artefacts/Release/VST3. Both had compiled perfectly; only
          # the check was wrong. This also matches the actual DLL inside the
          # bundle rather than the bundle directory, which is what the Linux job
          # does and is the stricter test.
          found=$(find build -path '*.vst3/Contents/x86_64-win/*.vst3' -print -quit)
          if [ -z "$found" ]; then
            echo "::error::${{ matrix.plugin }}_VST3 built without producing a VST3 binary"
            exit 1
          fi
          echo "Built: $found"
